name: EUEnabler
options:
  minimumXcodeGenVersion: 2.35.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES

targets:
  EUEnabler:
    type: application
    platform: iOS
    sources:
      - path: EUEnabler
    resources:
      - path: eligibility.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.1eddd.eu-enabler
        PRODUCT_NAME: EUEnabler
        INFOPLIST_FILE: EUEnabler/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: EUEnabler/EUEnabler-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: EUEnabler/EUEnabler.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
